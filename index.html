<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>tmux-dispatch</title>
    <script>
      // Apply the theme before first paint, so a dark page never flashes white.
      // Must agree with src/lib/theme.ts.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('tmux-dispatch-theme');
          dark = stored === 'dark'
            || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) { /* storage blocked: follow the system default (light) */ }
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
