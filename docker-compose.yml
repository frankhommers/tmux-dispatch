services:
  tmux-dispatch:
    image: ${TMUX_DISPATCH_IMAGE:-ghcr.io/frankhommers/tmux-dispatch:latest}
    # Publish on loopback for a local deployment; put a TLS proxy in front
    # when this is reachable from the internet.
    ports: ["127.0.0.1:7676:7676"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:7676}
      DATABASE_PATH: /data/tmux-mcp.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      # Sign-in is picked by what you set. Leaving these empty is not an
      # error: the service falls back to a token printed at startup.
      #   ADMIN_PASSWORD  a single password prompt, 12 characters or more
      #   OIDC_*          any provider with OIDC discovery
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_SUBS: ${OIDC_ALLOWED_SUBS:-}
      AUTH_MODE: ${AUTH_MODE:-}
    volumes:
      - tmux-dispatch:/data
    restart: unless-stopped

volumes:
  tmux-dispatch:
